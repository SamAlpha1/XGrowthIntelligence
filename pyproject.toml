[project]
name = "xgrowthintelligence"
version = "0.1.0"
description = "Read-only X growth intelligence and recommendation-system drift tracking"
requires-python = ">=3.11"
authors = [{name = "SamAlpha1"}]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
xgrowth = "xgrowth.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
