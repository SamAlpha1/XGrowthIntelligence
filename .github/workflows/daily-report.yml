name: Daily Report

on:
  workflow_run:
    workflows: ["X Metrics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Download latest triggering report artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: xgrowth-report
          path: report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Render sanitized summary
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from xgrowth.reporting.github_summary import render_daily_summary

          report = json.loads(Path("report/daily-report.json").read_text(encoding="utf-8"))
          summary = render_daily_summary(report)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY
      - name: Manual-dispatch note
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'Daily Report is populated automatically after a successful X Metrics run.' >> "$GITHUB_STEP_SUMMARY"
